<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ESP32-S3 Cloud Node</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            padding: 40px 24px 28px 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .title {
            font-size: 0.8rem;
            letter-spacing: 2px;
            color: #55555c;
            font-weight: 600;
        }
        .status-container {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: #71717a;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #ef4444;
        }
        .status-dot.online {
            background-color: #22c55e;
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.8);
        }
        .content {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin: auto 0;
        }
        .card {
            background: #09090b;
            border: 1px solid #18181b;
            border-radius: 20px;
            padding: 24px 28px;
        }
        .card-label {
            font-size: 0.75rem;
            letter-spacing: 2px;
            color: #71717a;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .val-group {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
        }
        .num {
            font-size: 4.2rem;
            font-weight: 300;
            letter-spacing: -2px;
            line-height: 1;
        }
        .unit {
            font-size: 1.4rem;
            font-weight: 400;
        }
        .temp-unit { color: #ea580c; }
        .hum-unit { color: #38bdf8; }
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: #52525b;
        }
        .mode-val {
            color: #3b82f6;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="header">
        <span class="title">ESP32-S3 CLOUD</span>
        <div class="status-container">
            <span id="status-text">Connecting...</span>
            <div class="status-dot" id="status-dot"></div>
        </div>
    </div>

    <div class="content">
        <div class="card">
            <div class="card-label">TEMPERATURE</div>
            <div class="val-group">
                <span id="temp-val" class="num">--.-</span>
                <span class="unit temp-unit">°C</span>
            </div>
        </div>

        <div class="card">
            <div class="card-label">HUMIDITY</div>
            <div class="val-group">
                <span id="hum-val" class="num">--.-</span>
                <span class="unit hum-unit">%</span>
            </div>
        </div>
    </div>

    <div class="footer">
        <span>MODE</span>
        <span class="mode-val">5G / Cloud MQTT</span>
    </div>

    <script>
        // ตั้งค่าให้ตรงกับ ESP32 เป๊ะๆ 100%
        const MQTT_BROKER = "broker.emqx.io";
        const MQTT_PORT   = 8084; // พอร์ต Secure WSS
        const MQTT_PATH   = "/mqtt";
        const MQTT_TOPIC  = "thnwathn/esp32/weather";
        const CLIENT_ID   = "WebClient_" + Math.random().toString(16).substr(2, 8);

        const client = new Paho.MQTT.Client(MQTT_BROKER, Number(MQTT_PORT), MQTT_PATH, CLIENT_ID);

        client.onConnectionLost = function(response) {
            document.getElementById("status-text").innerText = "Offline";
            document.getElementById("status-dot").className = "status-dot";
            setTimeout(initMQTT, 3000);
        };

        client.onMessageArrived = function(message) {
            try {
                const data = JSON.parse(message.payloadString);
                if (data.temp !== undefined) {
                    document.getElementById("temp-val").innerText = Number(data.temp).toFixed(1);
                }
                if (data.hum !== undefined) {
                    document.getElementById("hum-val").innerText = Number(data.hum).toFixed(1);
                }
            } catch (e) {
                console.error("Payload error:", e);
            }
        };

        function initMQTT() {
            client.connect({
                useSSL: true,
                timeout: 5,
                onSuccess: function() {
                    document.getElementById("status-text").innerText = "Connected";
                    document.getElementById("status-dot").className = "status-dot online";
                    client.subscribe(MQTT_TOPIC);
                },
                onFailure: function(err) {
                    document.getElementById("status-text").innerText = "Failed";
                    document.getElementById("status-dot").className = "status-dot";
                    setTimeout(initMQTT, 3000);
                }
            });
        }

        initMQTT();
    </script>
</body>
</html>
